name: Build & Release

on:
  push:
    tags: [ "v*" ]
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, out: PortView-Windows-x64.exe }
          - { arch: x86, out: PortView-Windows-x86.exe }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile
        shell: cmd
        run: |
          mkdir build
          cl /nologo /c /O2 /MT /GL /W3 /utf-8 /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /I src /Fobuild\ src\main.c src\ports.c src\proc.c src\ui.c
          rc /nologo /I src /fobuild\app.res src\app.rc
          link /nologo /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS /OUT:build\PortView.exe build\main.obj build\ports.obj build\proc.obj build\ui.obj build\app.res user32.lib gdi32.lib comctl32.lib shell32.lib advapi32.lib iphlpapi.lib ws2_32.lib psapi.lib uxtheme.lib

      - name: Rename output
        shell: bash
        run: |
          mkdir -p dist
          cp build/PortView.exe "dist/${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out }}
          generate_release_notes: true
          body: |
            ## 该下载哪个？

            | 文件 | 适用 |
            | --- | --- |
            | `PortView-Windows-x64.exe` | 64 位 Windows（Win7 ~ Win11，绝大多数电脑选这个） |
            | `PortView-Windows-x86.exe` | 32 位 Windows（老机器） |

            单文件、免安装，下载后双击即可运行；要查看或结束系统级进程，请右键「以管理员身份运行」。

            ## 功能

            - 查看 TCP/UDP（IPv4+IPv6）全部端口与连接被哪个进程占用
            - 双击查看详情：映像路径、命令行、该进程加载的全部模块文件
            - 打开关联文件所在位置、结束进程 / 结束进程树、按端口或进程名过滤、自动刷新
